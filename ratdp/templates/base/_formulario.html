{% for campo in form %}
  <div class="mb-3">
    <label class="form-label fw-semibold small" for="{{ campo.id_for_label }}">
      {{ campo.label }}{% if campo.field.required %} <span class="text-danger">*</span>{% endif %}
    </label>
    {{ campo }}
    {% if campo.help_text %}<div class="form-text small">{{ campo.help_text|safe }}</div>{% endif %}
    {% for e in campo.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
  </div>
{% endfor %}
{% if form.non_field_errors %}
  <div class="alert alert-danger">{{ form.non_field_errors }}</div>
{% endif %}
