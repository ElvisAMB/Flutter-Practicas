{% extends "base/base.html" %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Sistema RAT</h1>
        <p class="text-muted small mb-4">Registro de Actividades de Tratamiento</p>
        <form method="post" novalidate>
          {% csrf_token %}
          {% include "base/_formulario.html" %}
          <button class="btn btn-primary w-100">Ingresar</button>
        </form>
        <p class="text-muted small mt-3 mb-0">
          Todos los accesos, incluidos los intentos fallidos, quedan registrados
          en la bitácora de auditoría.
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
