{% extends "layout/base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card card-seccion">
      <div class="card-header">Ingresar al RAT</div>
      <div class="card-body">
        {% if form.errors %}
          <div class="alert alert-danger py-2 small">Usuario o contraseña incorrectos.</div>
        {% endif %}
        <form method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
            <input type="text" name="username" class="form-control" id="{{ form.username.id_for_label }}" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="{{ form.password.id_for_label }}">Contraseña</label>
            <input type="password" name="password" class="form-control" id="{{ form.password.id_for_label }}" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Ingresar</button>
          <input type="hidden" name="next" value="{{ next }}">
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
