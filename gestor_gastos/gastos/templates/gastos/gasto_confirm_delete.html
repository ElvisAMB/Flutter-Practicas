{% extends 'base.html' %}

{% block content %}

<h1>Eliminar gasto</h1>

<p>
    ¿Está seguro de eliminar este gasto?
</p>

<form method="post">

    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
        Sí, eliminar
    </button>

    <a href="{% url 'gasto_lista' %}" class="btn btn-secondary">
        Cancelar
    </a>

</form>

{% endblock %}
