{% extends 'base.html' %}

{% block title %}
Dashboard
{% endblock %}

{% block content %}

<h1 class="mb-4">
    Dashboard
</h1>

<div class="row">

    <div class="col-md-4">

        <div class="card card-dashboard shadow-sm">

            <div class="card-body">

                <h6>Total gastado</h6>

                <h2>
                    $ {{ total_gastos|floatformat:2 }}
                </h2>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card card-dashboard shadow-sm">

            <div class="card-body">

                <h6>Gastos registrados</h6>

                <h2>
                    {{ cantidad_gastos }}
                </h2>

            </div>

        </div>

    </div>

</div>

{% endblock %}
